[package]
name = "dx-panier"
version = "0.1.0"
authors = ["rondoudou"]
edition = "2024"
license = "Apache-2.0"
description = "Suivi local du prix des courses par produit et par magasin"

# Keeps the crate/lib name (and every `use dx_panier::...` import across src/)
# as "dx-panier" while the compiled executable and the package identity shown to
# end users (deb/rpm Name, installer filenames) carry the "Panier" branding.
# Without this the bin target defaults to the package name.
[[bin]]
name = "panier"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-i18n = "0.5.1"
unic-langid = { version = "0.9.6", features = ["macros"] }
# Persistence for every platform: localStorage in the browser, a JSON file under
# `set_dir!()` on desktop/Android. See src/storage.rs.
dioxus-sdk-storage = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
# dioxus 0.7 pulls getrandom 0.3; on wasm it needs a backend named explicitly,
# which is what the matching rustflag in .cargo/config.toml selects.
getrandom = { version = "0.3.4", features = ["wasm_js"] }

dioxus-desktop = { version = "0.7.10", optional = true }
# Native save dialog for exporting a backup file — see src/pages/settings.rs.
# Already resolved at this exact version as dioxus-desktop's own dependency (it
# uses the same crate for the desktop side of `<input type="file">`); declaring
# it ourselves only exposes the save-dialog half dioxus itself doesn't need.
# Not available on Android — rfd has no backend there — so not pulled into the
# "mobile" feature at all; see the cfg(feature = "mobile") fallback in
# settings.rs for what ships instead.
rfd = { version = "0.17.2", optional = true }
# Decodes assets/icon-512.png into raw RGBA at startup for tao's Icon::from_rgba, so
# `dx serve --platform desktop` shows the app icon in the taskbar too — the
# [bundle].icon path in Dioxus.toml only reaches `dx bundle` packaging, not the
# window tao opens for `dx serve`.
image = { version = "0.25", default-features = false, features = [
    "png",
], optional = true }

# Linux desktop only. GTK3 (which tao/wry render through) derives the Wayland
# xdg-shell app_id from g_get_prgname(); main.rs pins that at startup so the
# taskbar can resolve the app's icon. Same version tao's gtk 0.18 already pulls in.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
glib = { version = "0.22.9", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:dioxus-desktop", "dep:image", "dep:glib", "dep:rfd"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.android-dev]
inherits = "dev"
# Same reason as wasm-dev above: unoptimised, the price comparisons this app
# is built around run about five times slower, which on a phone is the
# difference between a tab switching instantly and visibly lagging.
opt-level = 1
